<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cars for sale | East Rand</title>
<meta name="description" content="Current stock, prices and details. Message on WhatsApp to view or reserve.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--ink:#111827;--mut:#5b6472;--bg:#f3f4f6;--card:#fff;--line:#e0e3e8;--blue:#0a1f8f;--tag:#ffd23f;--wa:#16a34a}
@media (prefers-color-scheme:dark){:root{--ink:#f3f4f6;--mut:#a2a9b5;--bg:#0e1116;--card:#171b22;--line:#2a303a;--blue:#6f86ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;line-height:1.45}
header{background:#0a1f8f;color:#fff;padding:28px 18px 22px}
.wrap{max-width:1040px;margin:0 auto}
h1{margin:0 0 6px;font-size:clamp(1.7rem,6vw,2.6rem);font-weight:800;letter-spacing:-.02em}
header p{margin:0;opacity:.85;max-width:46ch}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px auto}
.bar input,.bar select{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.bar input{flex:1 1 220px}
.count{color:var(--mut);margin:0 0 12px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;padding-bottom:30px}
.car{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:4/3;background:#d6d9df center/cover;display:grid;place-items:center;color:#7a828f;font-size:.9rem;position:relative}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.feat span{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--mut)}
.price{z-index:1;position:absolute;left:0;bottom:14px;background:var(--tag);color:#111;font-weight:800;font-size:1.25rem;padding:6px 14px 6px 12px;border-radius:0 8px 8px 0}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.car h2{margin:0;font-size:1.1rem;font-weight:800}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:.93rem}
dt{color:var(--mut)}dd{margin:0;font-weight:600}
.btns{display:flex;gap:8px;margin-top:auto}
.btns a{flex:1;text-align:center;padding:11px 8px;border-radius:10px;font-weight:600;text-decoration:none}
.wa{background:var(--wa);color:#fff}
.more{border:1px solid var(--line);color:var(--ink)}
a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.empty{padding:40px 0;color:var(--mut)}
footer{border-top:1px solid var(--line);padding:20px 18px 40px;color:var(--mut);font-size:.85rem}
</style>
</head>
<body>
<header><div class="wrap">
<h1 id="title">Cars for sale</h1>
<p id="sub">Current stock with prices. Tap WhatsApp to ask about a car or book a viewing.</p>
</div></header>

<main class="wrap" style="padding:0 18px">
<div class="bar">
<input id="q" type="search" placeholder="Search make or model, e.g. Chery" aria-label="Search cars">
<select id="sort" aria-label="Sort cars">
<option value="new">Newest added</option>
<option value="lo">Price: low to high</option>
<option value="hi">Price: high to low</option>
<option value="km">Lowest mileage</option>
</select>
</div>
<p class="count" id="count"></p>
<div class="grid" id="grid"></div>
</main>

<footer><div class="wrap">
<span id="foot"></span>
</div></footer>

const $ = id => document.getElementById(id);
const rand = n => "R " + n.toLocaleString("en-ZA").replace(/,/g, " ");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function card(c){
  const msg = encodeURIComponent(`Hi, I'm interested in the ${c.year} ${c.title} (stock no. ${c.stock}). Is it still available?`);
  const src = c.img || c.stock.replace("/","-") + ".jpg";
  const pic = `<div class="pic"><span>Photos on full details page</span><img src="${esc(src)}" alt="${esc(c.title)}" loading="lazy" onerror="this.remove()">`;
  const feat = (c.features && c.features.length) ? `<p class="feat">${c.features.map(f=>`<span>${esc(f)}</span>`).join("")}</p>` : "";
  return `<article class="car">${pic}<span class="price">${rand(c.price)}</span></div>
  <div class="body"><h2>${esc(c.year)} ${esc(c.title)}</h2>
  <dl><dt>Mileage</dt><dd>${c.kms.toLocaleString("en-ZA").replace(/,/g," ")} km</dd>
  <dt>Colour</dt><dd>${esc(c.colour)}</dd>
  <dt>Fuel</dt><dd>${esc(c.fuel)}</dd>
  <dt>Gearbox</dt><dd>${esc(c.trans)}</dd>
  <dt>Service plan</dt><dd>${esc(c.servicePlan)}</dd>
  <dt>Maintenance plan</dt><dd>${esc(c.maintenancePlan)}</dd>
  <dt>Warranty</dt><dd>${esc(c.warranty)}</dd>
  <dt>Stock no.</dt><dd>${esc(c.stock)}</dd></dl>${feat}
  <div class="btns"><a class="wa" href="https://wa.me/${SETTINGS.whatsapp}?text=${msg}">WhatsApp</a>
  ${c.link ? `<a class="more" href="${esc(c.link)}" target="_blank" rel="noopener">Full details</a>` : ""}</div></div></article>`;
}

function render(){
  const q = $("q").value.trim().toLowerCase(), s = $("sort").value;
  let list = CARS.map((c,i)=>({...c,i})).filter(c => (c.title+" "+c.colour+" "+c.year).toLowerCase().includes(q));
  if (s==="lo") list.sort((a,b)=>a.price-b.price);
  if (s==="hi") list.sort((a,b)=>b.price-a.price);
  if (s==="km") list.sort((a,b)=>a.kms-b.kms);
  $("count").textContent = list.length + (list.length===1 ? " car available" : " cars available");
  $("grid").innerHTML = list.length ? list.map(card).join("") : `<p class="empty">No cars match that search. Clear the search box to see all stock.</p>`;
}

$("foot").textContent = `Listed by ${SETTINGS.sellerName}, sales consultant at ${SETTINGS.dealership}. Prices and availability can change; confirm with the dealership.`;
$("q").addEventListener("input", render);
$("sort").addEventListener("change", render);
render();
</script>
</body>
</html>
